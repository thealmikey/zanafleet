version: '3.9'

services:
  # ========================================================================
  # PostgreSQL - Primary data store for ZanaFleet primitives
  # ========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: zanafleet-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zanafleet_test
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zanafleet-test

  # ========================================================================
  # Neo4j - Graph database for projections and relationships
  # ========================================================================
  neo4j:
    image: neo4j:5-community
    container_name: zanafleet-neo4j-test
    environment:
      NEO4J_AUTH: none
      NEO4J_apoc_import_file_enabled: 'true'
      NEO4J_apoc_export_file_enabled: 'true'
    ports:
      - '7687:7687'  # Bolt protocol
      - '7474:7474'  # HTTP (Browser)
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://localhost:7474 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zanafleet-test

  # ========================================================================
  # Keycloak - Identity and Access Management
  # Test environment configuration with embedded H2 database
  # ========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: zanafleet-keycloak-test
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/localhost/8080 && echo -e "GET /health/ready HTTP/1.1\nHost: localhost\nConnection: close\n\n" >&3 && cat <&3 | grep -q "200 OK"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - zanafleet-test

  # ========================================================================
  # NATS - Event Bus for inter-module communication
  # ========================================================================
  nats:
    image: nats:2.10-alpine
    container_name: zanafleet-nats-test
    command: ['--jetstream', '--store_dir', '/data', '-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - nats_data:/data
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zanafleet-test

  # ========================================================================
  # Redis (Optional) - Caching for future use
  # ========================================================================


volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  keycloak_data:
    driver: local
  nats_data:
    driver: local

networks:
  zanafleet-test:
    driver: bridge
